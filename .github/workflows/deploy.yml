# Redeploys the platform API after every registry change on main, and fails (a red
# check on the merge commit) if it isn't serving the new registry within ten minutes
# (DESIGN §2b-2c). The API bakes the registry in at build time, so without this a
# merge here never reaches it. The API is the Cloudflare Worker c4n-api
# (api.confused4now.org): suggest-edit-function's worker.yml, called here, bundles the
# registry, tests, deploys and waits for X-Function-Version. Needs
# CLOUDFLARE_WORKERS_TOKEN. Also runs on a schedule as a staleness alarm.
# (Until 14 Nov 2026 a second job kept the Vercel copy current; Vercel is retired.)
name: deploy

on:
  workflow_run:
    workflows: [validate]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '41 */6 * * *'

permissions:
  contents: read

# One deploy at a time. A newer merge queues behind the running one rather than
# cancelling it, so every merge commit gets its check.
concurrency:
  group: deploy-suggest-edit
  cancel-in-progress: false

jobs:
  worker:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    uses: textbookproject2026-alt/suggest-edit-function/.github/workflows/worker.yml@main
    secrets:
      CLOUDFLARE_WORKERS_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
